version: 2

name: INVOICE_RECONCILIATION
database: SNOWFLAKE_DEMO
schema: CORTEX_SENSE
query_warehouse: COMPUTE_WH
build_eai: GHA_APP_NPM_EAI

label: "Invoice Reconciliation"
description: "Upload invoice PDFs, extract them with AI_EXTRACT, reconcile against Summit Outfitters orders, review and approve, and chat with the Summit Retail agent."
icon: public/icon.svg

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - coverage
  - output
  - "*.tsbuildinfo"

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]
