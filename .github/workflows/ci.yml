# Pull-request checks for the invoice app: typecheck, unit tests and a production
# build. Needs no Snowflake access (route tests mock lib/snowflake). Runs on pull
# requests and is reused by deploy.yml as the gate before deploying.
name: CI

on:
  pull_request:
    paths:
      - "invoice-app/**"
      - ".github/workflows/ci.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # @snowflake/cortex-agent-sdk requires Node >= 22.22
          node-version: "22"
          cache: npm
          cache-dependency-path: invoice-app/package-lock.json

      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
